[project]
name = "cms-ncci-rag"
version = "1.0.0"
description = "Vector-less RAG system for 2026 NCCI Medicare Policy Manual"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
