[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2code"
version = "1.0.0"
description = "Convert Natural Language to Code - Python, Java, C++, C#/.NET"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "streamlit>=1.30.0",
    "requests>=2.31.0",
]

[project.scripts]
nl2code = "nl2code.cli:main"

[tool.setuptools.packages.find]
include = ["nl2code*"]
